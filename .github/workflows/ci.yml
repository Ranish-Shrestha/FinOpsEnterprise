name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Runners are pinned to ubuntu-24.04 (not ubuntu-latest) so OS upgrades are a deliberate change.
jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Locked mode fails on lockfile drift; NuGet audit warnings fail the build (TreatWarningsAsErrors).
      - name: Restore
        run: dotnet restore FinOpsEnterprise.slnx --locked-mode

      - name: Build
        run: dotnet build FinOpsEnterprise.slnx --no-restore --configuration Release

      - name: Unit and HTTP tests
        run: >
          dotnet test FinOpsEnterprise.slnx --no-build --configuration Release
          --filter "Category!=Database" --logger "trx;LogFilePrefix=fast"

      # GitHub-hosted Ubuntu runners include Docker, so Testcontainers runs a real SQL Server.
      # Includes the latency targets (Category=Performance), which are enforced here because CI sets CI=true.
      - name: Real SQL Server tests
        run: >
          dotnet test tests/FinOps.IntegrationTests --no-build --configuration Release
          --filter "Category=Database" --logger "trx;LogFilePrefix=database"

      - name: EF model matches migrations
        env:
          ASPNETCORE_ENVIRONMENT: Development
          # Design-time only: the command builds the model and never connects.
          ConnectionStrings__FinOps: Server=127.0.0.1,1;Database=DesignTime;User Id=ci;Password=unused;TrustServerCertificate=True
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/FinOps.Infrastructure --startup-project src/FinOps.Api \
            --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/performance-*.json
          if-no-files-found: ignore

  frontend:
    name: Angular typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/finops-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/finops-web/package-lock.json

      - name: Use the npm version from package.json
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Gate on what ships to browsers. Dev-tool advisories are reported but tracked separately
      # (see docs/verification.md) because their fixes require an Angular CLI major upgrade.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency audit (informational)
        run: npm audit || true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A disposable SQL Server with a password generated for this run only (masked in logs).
      - name: Start SQL Server
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 12)-Aa1"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name sqlserver -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
          echo "E2E_CONNECTION_STRING=Server=127.0.0.1,1433;Database=FinOpsE2E;User Id=sa;Password=$SA_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null && exit 0
            sleep 3
          done
          docker logs sqlserver; exit 1

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build API and worker
        run: |
          dotnet restore FinOpsEnterprise.slnx --locked-mode
          dotnet build FinOpsEnterprise.slnx --no-restore --configuration Release

      - name: Migrate and seed the database
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          export ConnectionStrings__FinOps="$E2E_CONNECTION_STRING"
          dotnet tool restore
          dotnet ef database update --project src/FinOps.Infrastructure --startup-project src/FinOps.Api \
            --configuration Release --no-build
          cd src/FinOps.Api/bin/Release/net10.0 && dotnet FinOps.Api.dll seed-demo-data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/finops-web/package-lock.json

      - name: Install UI dependencies and Chromium
        working-directory: src/finops-web
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts the API (port 5199) and the UI (port 4300); global setup starts the worker.
      - name: End-to-end tests
        working-directory: src/finops-web
        run: |
          npm run e2e:typecheck
          npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/finops-web/playwright-report
            src/finops-web/test-results
          if-no-files-found: ignore

  deployables:
    name: Container images and Bicep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same Dockerfile the deploy workflow pushes; built here (not pushed) so a broken image fails the PR.
      - name: Build API and worker images
        run: |
          docker build --target api --tag finops-api:ci .
          docker build --target worker --tag finops-worker:ci .
          # The image defaults to Production, where demo identities must be refused.
          if out=$(docker run --rm finops-api:ci seed-demo-data 2>&1); then echo "seed-demo-data must fail in Production"; exit 1; fi
          echo "$out" | grep "available only when ASPNETCORE_ENVIRONMENT=Development"

      # Compile and lint the infrastructure (infra/bicepconfig.json raises secret-handling rules to errors).
      - name: Bicep build and lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  # Blocks pull requests that add dependencies with known high-severity vulnerabilities.
  # Requires the repository's Dependency graph (Settings → Advanced Security → Dependency graph);
  # without it this job fails with "Dependency review is not supported on this repository".
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
