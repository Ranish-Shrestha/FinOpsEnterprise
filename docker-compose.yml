name: finops-enterprise

services:
  sqlserver:
    # Pinned for reproducibility. Keep in sync with SqlServerFixture.Image in the integration tests.
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Optional telemetry UI: traces, metrics and logs from the API and worker (OTLP). Start it with
  #   docker compose --profile observability up -d aspire-dashboard
  # then open http://localhost:18888. Anonymous access is fine only because both ports bind to 127.0.0.1.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    profiles: [observability]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"   # dashboard UI
      - "127.0.0.1:4317:18889"    # OTLP/gRPC receiver

volumes:
  sqlserver-data:
